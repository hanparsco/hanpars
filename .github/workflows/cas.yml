name: CAS numbers for the API range
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: pubchem
  cancel-in-progress: false
jobs:
  cas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: main }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: python scripts/fetch-cas.py 2>&1 | tee scripts/cas-last-run.log
      - env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          git config user.name "hanpars-bot"; git config user.email "actions@users.noreply.github.com"
          git add src/data/apis.json scripts/cas-last-run.log
          git diff --cached --quiet && exit 0
          git commit -m "API range: CAS numbers from PubChem" && git pull --rebase origin main && git push
          gh workflow run deploy.yml --ref main
