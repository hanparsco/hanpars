name: Persian pharma news (every 4 hours)

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: "Rewrite even if the same stories are selected"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: news-fa
  cancel-in-progress: false

jobs:
  news-fa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned, hash-verified Python dependencies
        run: |
          pip install --quiet --require-hashes --no-deps --only-binary=:all: -r scripts/requirements-news.txt
      - name: Fetch the latest Persian stories
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: |
          set -o pipefail
          python scripts/fetch-news-fa.py 2>&1 | tee scripts/news-fa-last-run.log
      - name: Commit the stories
        id: commit
        run: |
          git config user.name "hanpars-news-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- src/data/news-fa.json && [ -z "$(git status --porcelain -- public/news)" ]; then echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git add src/data/news-fa.json public/news scripts/news-fa-last-run.log
          git commit -m "Persian news $(date -u +'%F %H:%M')"
          git pull --rebase origin main
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Rebuild and deploy the site
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
