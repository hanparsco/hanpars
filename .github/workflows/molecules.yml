name: Molecule pages data (PubChem)
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Rebuild everything (ignore cached entries)'
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: pubchem
  cancel-in-progress: false
jobs:
  molecules:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/fetch-molecules.py ${{ inputs.refresh && '--refresh' || '' }} 2>&1 | tee scripts/molecules-last-run.log
      - env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          git config user.name "hanpars-bot"; git config user.email "actions@users.noreply.github.com"
          git add src/data/apis.json src/data/molecules.json public/molecules scripts/molecules-last-run.log
          git diff --cached --quiet && exit 0
          git commit -m "Molecule data from PubChem" && git pull --rebase origin main && git push
          gh workflow run deploy.yml --ref main
