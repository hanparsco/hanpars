name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe Chinese news sources
        run: |
          python3 scripts/probe-zh-sources.py > probe.log 2>&1 || true
          git config user.name hanpars-ci && git config user.email ci@hanpars.com
          git fetch -q origin ci-report && git worktree add -q /tmp/rep origin/ci-report
          cp probe.log /tmp/rep/probe.log
          cd /tmp/rep && git add probe.log && git commit -qm "probe zh" && git push -q origin HEAD:ci-report
