name: Probe (temporary)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Probe Persian news sources
        run: |
          {
          for u in https://www.daroovasalamat.ir/ http://www.daroovasalamat.ir/ https://daroovasalamat.ir/ http://daroovasalamat.ir/; do
            echo "== $u"; curl -sSL -v -A "Mozilla/5.0" -m 30 -o /tmp/p.out "$u" 2>&1 | grep -vE "^\{|^\}|^\*  (CA|SSL|TLS|subject|start|expire|issuer|ALPN)" | head -30; echo "--- body:"; head -c 1500 /tmp/p.out 2>/dev/null; echo
          done
          echo "== dns"; dig +short www.daroovasalamat.ir A; dig +short daroovasalamat.ir A; dig +short www.daroovasalamat.ir NS; dig +short daroovasalamat.ir NS
          echo "== doshanbe categories"; curl -sL -A "Mozilla/5.0" -m 25 "https://doshanbehayedarouei.ir/wp-json/wp/v2/categories?per_page=50" | python3 -c "import json,sys;[print(c['id'],c['slug'],c['name'],c['count']) for c in json.load(sys.stdin)]"
          echo "== doshanbe feed items"; curl -sL -A "Mozilla/5.0" -m 25 https://doshanbehayedarouei.ir/feed/ | grep -oE "<title>[^<]*</title>|<pubDate>[^<]*</pubDate>|<category><!\[CDATA\[[^]]*" | head -60
          echo "== doshanbe post sample"; curl -sL -A "Mozilla/5.0" -m 25 "https://doshanbehayedarouei.ir/wp-json/wp/v2/posts?per_page=5&_fields=id,date_gmt,link,title,excerpt,jetpack_featured_media_url,featured_media,categories" 
          } > probe.log 2>&1 || true
          git config user.name hanpars-ci && git config user.email ci@hanpars.com
          git fetch -q origin ci-report && git worktree add -q /tmp/rep origin/ci-report
          cp probe.log /tmp/rep/probe.log
          cd /tmp/rep && git add probe.log && git commit -qm "probe" && git push -q origin HEAD:ci-report
