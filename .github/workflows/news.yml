name: Daily pharma news

on:
  schedule:
    # GitHub often starts scheduled runs hours late, so several attempts are spread over the Tehran night/morning.
    # The script is a no-op once today's (Tehran) digest exists, so extra attempts cost nothing.
    - cron: '41 20 * * *'  # 00:11 Tehran
    - cron: '23 22 * * *'  # 01:53 Tehran
    - cron: '17 0 * * *'   # 03:47 Tehran
    - cron: '17 2 * * *'   # 05:47 Tehran
    - cron: '43 4 * * *'   # 08:13 Tehran
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if today's digest exists"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned, hash-verified Python dependencies
        run: |
          pip install --quiet --require-hashes --no-deps --only-binary=:all: -r scripts/requirements-news.txt
      - name: Fetch and rank today's stories
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: |
          set -o pipefail
          python scripts/fetch-news.py 2>&1 | tee scripts/news-last-run.log
      - name: Commit the digest
        id: commit
        run: |
          git config user.name "hanpars-news-bot"
          git config user.email "actions@users.noreply.github.com"
          # a no-op run only rewrites the log: don't commit or redeploy for that
          if git diff --quiet -- src/data/news.json && [ -z "$(git status --porcelain -- public/news)" ]; then echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git add src/data/news.json public/news scripts/news-last-run.log
          git commit -m "News digest $(date -u +%F)"
          git pull --rebase origin main
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Rebuild and deploy the site
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
