name: Daily pharma news

on:
  schedule:
    - cron: '17 2 * * *'   # ~05:47 Tehran (UTC+3:30)
    - cron: '43 4 * * *'   # backup if GitHub skipped or delayed the first run (no-op when already updated today)
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if today's digest exists"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Fetch and rank today's stories
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: |
          set -o pipefail
          python scripts/fetch-news.py 2>&1 | tee scripts/news-last-run.log
      - name: Commit the digest
        id: commit
        run: |
          git config user.name "hanpars-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/news.json public/news scripts/news-last-run.log
          if git diff --cached --quiet; then echo "changed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "News digest $(date -u +%F)"
          git pull --rebase origin main
          git push
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Rebuild and deploy the site
        if: steps.commit.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
