name: Deploy Hanpars site to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch photographs (cached in the repository once downloaded)
        id: photos
        run: bash scripts/fetch-photos.sh
      - name: Commit newly fetched photographs back to the branch
        if: steps.photos.outputs.changed == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/photos
          git commit -m "Add photographs fetched by CI [skip ci]"
          git push
      - run: pnpm install --frozen-lockfile
      - name: Type check
        id: check
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee check.log
      - name: Publish check log on failure
        if: failure() && steps.check.outcome == 'failure'
        run: |
          git config user.name "hanpars-bot"; git config user.email "actions@users.noreply.github.com"
          git fetch -q origin ci-report || true
          git checkout -q -B ci-report
          git rm -rq --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/report && cp check.log /tmp/report/check.log
          git clean -fdxq -e node_modules >/dev/null 2>&1 || true
          cp /tmp/report/check.log ./check.log
          git add check.log && git commit -qm "check log $(date -u +%FT%TZ) for ${GITHUB_SHA::7}" || true
          git push -f -q origin ci-report
      - name: Build
        id: build
        shell: bash
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      - name: Publish build log on failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          git config user.name "hanpars-bot"; git config user.email "actions@users.noreply.github.com"
          tail -n 300 build.log > /tmp/build.log
          git fetch -q origin ci-report && git worktree add -q /tmp/rep origin/ci-report
          cp /tmp/build.log /tmp/rep/build.log
          cd /tmp/rep && git add build.log && git commit -qm "build log ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-report || true
      - name: SEO audit (report to ci-report branch)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          node scripts/seo-audit.mjs dist
          git config user.name "hanpars-bot"; git config user.email "actions@users.noreply.github.com"
          cp seo-audit.json /tmp/seo-audit.json
          git fetch -q origin ci-report && git worktree add -q /tmp/rep origin/ci-report
          cp /tmp/seo-audit.json /tmp/rep/seo-audit.json
          cd /tmp/rep && git add seo-audit.json && git commit -qm "seo audit ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-report || true
      - name: Language audit (report to ci-report branch)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          for l in zh tr fa; do node scripts/lang-audit.mjs dist $l; done
          git config user.name "hanpars-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/la && cp lang-audit-*.json /tmp/la/
          git fetch -q origin ci-report && git worktree add -q /tmp/rep2 origin/ci-report
          cp /tmp/la/*.json /tmp/rep2/
          cd /tmp/rep2 && git add lang-audit-*.json && git commit -qm "language audit ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-report || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish preview build to a dist-* branch (non-main only)
        if: github.ref != 'refs/heads/main'
        run: |
          set -e
          BR="dist-${GITHUB_REF_NAME}"
          cd dist
          git init -q -b "$BR"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Preview build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BR"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Report Pages domain status (informational)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/pages --jq '{cname, https_enforced, cert: .https_certificate.state}' || true

  indexnow:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify search engines (IndexNow)
        run: sleep 60 && python3 scripts/indexnow.py
