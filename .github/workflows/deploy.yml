name: Deploy Hanpars site to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch photographs (cached in the repository once downloaded)
        id: photos
        continue-on-error: true   # a third-party image outage must never block a release; cached photos are used
        run: bash scripts/fetch-photos.sh
      - name: Commit newly fetched photographs back to the branch
        if: steps.photos.outputs.changed == '1' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/photos
          git commit -m "Add photographs fetched by CI [skip ci]"
          git push
      - run: pnpm install --frozen-lockfile
      - name: Type check
        id: check
        shell: bash
        run: |
          set -o pipefail
          pnpm check 2>&1 | tee check.log
      - name: Publish check log on failure
        if: failure() && steps.check.outcome == 'failure'
        run: |
          git config user.name "hanpars-bot"; git config user.email "actions@users.noreply.github.com"
          cp check.log /tmp/check.log
          git fetch -q origin ci-report && git worktree add -q /tmp/rep origin/ci-report
          cp /tmp/check.log /tmp/rep/check.log
          cd /tmp/rep && git add check.log && git commit -qm "check log $(date -u +%FT%TZ) for ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-report || true
      - name: Build
        id: build
        shell: bash
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee build.log
      - name: Publish build log on failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          git config user.name "hanpars-bot"; git config user.email "actions@users.noreply.github.com"
          tail -n 300 build.log > /tmp/build.log
          git fetch -q origin ci-report && git worktree add -q /tmp/rep origin/ci-report
          cp /tmp/build.log /tmp/rep/build.log
          cd /tmp/rep && git add build.log && git commit -qm "build log ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-report || true
      - name: SEO release gate (canonicals, hreflang, JSON-LD, sitemap/noindex, compatibility stubs)
        run: node scripts/seo-audit.mjs dist --strict
      - name: SEO audit (report to ci-report branch)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "hanpars-bot"; git config user.email "actions@users.noreply.github.com"
          cp seo-audit.json /tmp/seo-audit.json
          git fetch -q origin ci-report && git worktree add -q /tmp/rep origin/ci-report
          cp /tmp/seo-audit.json /tmp/rep/seo-audit.json
          cd /tmp/rep && git add seo-audit.json && git commit -qm "seo audit ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-report || true
      - name: Language audit (report to ci-report branch)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          for l in zh tr fa; do node scripts/lang-audit.mjs dist $l; done
          git config user.name "hanpars-bot"; git config user.email "actions@users.noreply.github.com"
          mkdir -p /tmp/la && cp lang-audit-*.json /tmp/la/
          git fetch -q origin ci-report && git worktree add -q /tmp/rep2 origin/ci-report
          cp /tmp/la/*.json /tmp/rep2/
          cd /tmp/rep2 && git add lang-audit-*.json && git commit -qm "language audit ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-report || true
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist
      - name: Publish preview build to a dist-* branch (non-main only)
        if: github.ref != 'refs/heads/main'
        run: |
          set -e
          BR="dist-${GITHUB_REF_NAME}"
          # reuse the checkout's credential (actions/checkout stores it as an http.extraheader), so no token appears in a URL
          AUTH="$(git config --get http.https://github.com/.extraheader)"
          cd dist
          git init -q -b "$BR"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Preview build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git -c "http.https://github.com/.extraheader=$AUTH" push -f -q "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BR"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Report Pages domain status (informational)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/pages --jq '{cname, https_enforced, cert: .https_certificate.state}' || true

  indexnow:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Notify search engines (IndexNow, Baidu push when a token is set)
        env:
          BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
        run: sleep 60 && python3 scripts/indexnow.py

  smoke:
    # post-deploy smoke test of the live site: a failure turns this run red (GitHub e-mails the owner)
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check the live site after deployment
        run: |
          sleep 90
          python3 scripts/live-check.py 2>&1 | tee live-check.log
          exit ${PIPESTATUS[0]}
      - name: Publish live-check log (ci-report branch)
        if: always()
        run: |
          git config user.name hanpars-ci && git config user.email ci@hanpars.com
          git fetch -q origin ci-report && git worktree add -q /tmp/rep origin/ci-report
          cp live-check.log /tmp/rep/live-check.log
          cd /tmp/rep && git add live-check.log && git commit -qm "live check ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-report || true
