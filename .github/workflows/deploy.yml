name: Deploy Hanpars site to GitHub Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Fetch photographs (cached in the repository once downloaded)
        id: photos
        run: bash scripts/fetch-photos.sh
      - name: Commit newly fetched photographs back to the branch
        if: steps.photos.outputs.changed == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add public/photos
          git commit -m "Add photographs fetched by CI [skip ci]"
          git push
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
        env:
          PUBLIC_WEB3FORMS_KEY: ${{ vars.PUBLIC_WEB3FORMS_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish preview build to a dist-* branch (non-main only)
        if: github.ref != 'refs/heads/main'
        run: |
          set -e
          BR="dist-${GITHUB_REF_NAME}"
          cd dist
          git init -q -b "$BR"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Preview build of ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BR"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Ensure custom domain and HTTPS enforcement
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOMAIN: hanpars.com
        run: |
          {
            echo "### Pages domain step — run ${GITHUB_RUN_ID}"
            echo '```'
            echo "BEFORE:"; gh api repos/${GITHUB_REPOSITORY}/pages 2>&1 | head -c 1500; echo
            echo "SET CNAME:"; gh api -X PUT repos/${GITHUB_REPOSITORY}/pages -f cname="$DOMAIN" 2>&1 | head -c 800; echo " (exit $?)"
            echo "ENFORCE HTTPS:"; gh api -X PUT repos/${GITHUB_REPOSITORY}/pages -F https_enforced=true 2>&1 | head -c 800; echo " (exit $?)"
            echo "AFTER:"; gh api repos/${GITHUB_REPOSITORY}/pages 2>&1 | head -c 1500; echo
            echo '```'
          } > pages-report.md
          cat pages-report.md
          set +e
          rm -rf /tmp/report && mkdir /tmp/report && cp pages-report.md /tmp/report/ && cd /tmp/report
          git init -q -b ci-report && git config user.name github-actions && git config user.email actions@github.com
          git add -A && git commit -q -m "Pages domain report ${GITHUB_RUN_ID}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ci-report
          exit 0
