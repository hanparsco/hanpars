<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-label="Conceptual interlocking blue glass forms representing connected expertise">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F7FD"/>
      <stop offset="1" stop-color="#CDEEFB"/>
    </linearGradient>
    <linearGradient id="navyGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A4A" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#1D4F80" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="skyGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62D0F5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2FA9D8" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="whiteGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0B2A4A" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg2)"/>
  <circle cx="760" cy="140" r="120" fill="#62D0F5" opacity="0.18"/>
  <circle cx="160" cy="600" r="150" fill="#0B2A4A" opacity="0.06"/>

  <!-- interlocking rings -->
  <g filter="url(#shadow)">
    <circle cx="390" cy="340" r="170" fill="none" stroke="url(#navyGlass)" stroke-width="58"/>
    <circle cx="570" cy="400" r="170" fill="none" stroke="url(#skyGlass)" stroke-width="58"/>
    <!-- over/under illusion -->
    <path d="M470 194 A170 170 0 0 1 560 340" fill="none" stroke="url(#navyGlass)" stroke-width="58" stroke-linecap="butt"/>
    <!-- light highlights -->
    <path d="M250 300 A170 170 0 0 1 330 200" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
    <path d="M700 320 A170 170 0 0 1 735 430" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- white glass bar linking the rings -->
  <g filter="url(#shadow)">
    <rect x="300" y="520" width="380" height="54" rx="27" fill="url(#whiteGlass)" stroke="#ffffff" stroke-width="2"/>
    <circle cx="328" cy="547" r="12" fill="#0B2A4A"/>
    <circle cx="490" cy="547" r="12" fill="#62D0F5"/>
    <circle cx="652" cy="547" r="12" fill="#0B2A4A"/>
    <path d="M340 547 H478 M502 547 H640" stroke="#0B2A4A" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="4 8"/>
  </g>

  <!-- small dots -->
  <g fill="#0B2A4A" opacity="0.25">
    <circle cx="150" cy="170" r="6"/><circle cx="190" cy="200" r="4"/><circle cx="130" cy="220" r="3"/>
    <circle cx="830" cy="600" r="6"/><circle cx="870" cy="570" r="4"/><circle cx="800" cy="640" r="3"/>
  </g>
</svg>
