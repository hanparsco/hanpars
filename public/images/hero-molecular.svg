<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-label="Conceptual frosted-glass capsule and connected molecular-inspired forms">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2A4A"/>
      <stop offset="1" stop-color="#143F6B"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#62D0F5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FE0FA"/>
      <stop offset="1" stop-color="#62D0F5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#62D0F5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#62D0F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <circle cx="300" cy="420" r="260" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="700" cy="220" r="200" fill="url(#glow)" filter="url(#blur)" opacity="0.7"/>

  <!-- connection lines -->
  <g stroke="#62D0F5" stroke-opacity="0.45" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M520 360 L690 230"/>
    <path d="M690 230 L820 300"/>
    <path d="M520 360 L640 520"/>
    <path d="M640 520 L790 470"/>
    <path d="M690 230 L640 520" stroke-dasharray="6 12"/>
    <path d="M250 200 L430 300" stroke-dasharray="6 12"/>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="690" cy="230" r="34" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="820" cy="300" r="22" fill="url(#sky)" opacity="0.9"/>
    <circle cx="640" cy="520" r="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="790" cy="470" r="18" fill="url(#sky)" opacity="0.85"/>
    <circle cx="250" cy="200" r="16" fill="url(#sky)" opacity="0.8"/>
    <circle cx="430" cy="300" r="12" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- frosted capsule -->
  <g transform="translate(340 420) rotate(-32)">
    <rect x="-200" y="-70" width="400" height="140" rx="70" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
    <path d="M0 -70 V70" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="0" y="-70" width="200" height="140" rx="70" fill="#62D0F5" opacity="0.45"/>
    <path d="M-160 -38 Q-60 -62 60 -48" stroke="#ffffff" stroke-opacity="0.8" stroke-width="6" stroke-linecap="round" fill="none" filter="url(#soft)"/>
  </g>

  <!-- small hex ring -->
  <g transform="translate(180 560)" fill="none" stroke="#8FE0FA" stroke-opacity="0.6" stroke-width="3" stroke-linejoin="round">
    <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23"/>
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" stroke-opacity="0.35"/>
  </g>
</svg>
